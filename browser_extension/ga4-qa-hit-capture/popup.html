<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GA4 QA Hit Capture</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 12px; width: 320px; }
      label { display: block; font-size: 12px; margin: 8px 0 4px; color: #374151; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #111827; color: #fff; cursor: pointer; }
      .hint { margin-top: 8px; font-size: 11px; color: #6b7280; }
      .ok { margin-top: 8px; font-size: 12px; color: #065f46; }
    </style>
  </head>
  <body>
    <label for="ingestUrl">수집 엔드포인트</label>
    <input id="ingestUrl" placeholder="https://asknuggetdata.com/qa/collect" />

    <label for="sessionId">기본 세션 ID(선택)</label>
    <input id="sessionId" placeholder="dbg_..." />

    <button id="saveBtn">저장</button>
    <div id="status" class="ok"></div>
    <div class="hint">URL 쿼리의 `qa_debug_session_id`가 있으면 자동으로 우선 사용됩니다.</div>
    <script src="popup.js"></script>
  </body>
  </html>
